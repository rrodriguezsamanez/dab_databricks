name: Deploy bundle a produccion (dtbrsmartp01)

concurrency:
  group: prod-bakehouse-analytics
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "bakehouse_analytics/**"
      - ".github/workflows/prod_deployment.yml"

jobs:
  deploy:
    name: Validar y desplegar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bakehouse_analytics
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
      DATABRICKS_BUNDLE_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Apuntar el dashboard a prod
        run: |
          sed -i 's/bakehouse_analytics_dev\./bakehouse_analytics_prod./g' src/bakehouse_overview.lvdash.json
          grep -q "bakehouse_analytics_prod\." src/bakehouse_overview.lvdash.json || { echo "No se reemplazó nada"; exit 1; }

      - name: Validar bundle
        run: databricks bundle validate

      - name: Desplegar bundle
        run: databricks bundle deploy
